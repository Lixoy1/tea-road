name: Deploy Tea Road to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Tea Road v1.0 files
        run: |
          test -f src/main-v10.jsx
          test -f src/admin-v10.jsx
          test -f src/admin-v10.css
          test -f src/entry-v10.js
          test -f src/tea-road-v10.css
          test -f public/tea-road-bg.svg
          test -f index.html
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Runtime smoke test
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('dist/index.html','utf8');
          if(!html.includes('/assets/')) throw new Error('Built index.html has no assets');
          const files=fs.readdirSync('dist/assets').filter(x=>x.endsWith('.js'));
          if(!files.length) throw new Error('No production JS bundle found');
          const bundle=files.map(x=>fs.readFileSync('dist/assets/'+x,'utf8')).join('\n');
          for(const s of ['createRoot','localStorage','Tea Road','Telegram','Start harvest','ADMIN CONSOLE','Risk alerts','Lucky Spin']) if(!bundle.includes(s)) throw new Error('Bundle missing '+s);
          console.log('Tea Road v1.0 + admin smoke test passed:',files.join(', '));
          NODE
      - name: Add runtime fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace('<div id="root"></div>','<div id="root"><div style="min-height:100vh;display:grid;place-items:center;background:#07110d;color:#d8c69a;font:500 15px system-ui,sans-serif">Загрузка TEA ROAD…</div></div>')
          p.write_text(s,encoding="utf-8")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

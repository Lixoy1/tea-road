name: Deploy Tea Road to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply build compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")
          s = s.replace("History,Home,Languages,Leaf", "History,Home as HomeIcon,Languages,Leaf")
          s = s.replace('["home","Главная",Home]', '["home","Главная",HomeIcon]')
          if "createRoot(" in s and "from\"react-dom/client\"" not in s and "from \"react-dom/client\"" not in s:
              s = 'import { createRoot } from "react-dom/client";\n' + s
          p.write_text(s, encoding="utf-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Runtime smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (!html.includes('/assets/')) throw new Error('Built index.html has no assets');
          const js = fs.readdirSync('dist/assets').find(x => x.endsWith('.js'));
          if (!js) throw new Error('No production JS bundle found');
          const bundle = fs.readFileSync('dist/assets/' + js, 'utf8');
          if (bundle.includes('createRoot') && !bundle.includes('react-dom')) throw new Error('createRoot runtime import missing');
          if (bundle.includes('ReferenceError: createRoot')) throw new Error('createRoot ReferenceError remains in bundle');
          console.log('Runtime smoke test passed:', js);
          NODE

      - name: Add runtime fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<div id="root"></div>',
              '''<div id="root"><div id="tea-boot" style="min-height:100vh;display:grid;place-items:center;background:#07100d;color:#d8c69a;font:500 15px system-ui,sans-serif;text-align:center;padding:24px"><div><div style="font-size:30px;margin-bottom:12px">🍃</div><b style="font-size:22px">TEA ROAD</b><p style="opacity:.72">Загрузка чайного пути…</p></div></div></div>\n<script>window.addEventListener('error',function(e){var r=document.getElementById('root');if(r&&(!r.children.length||document.getElementById('tea-boot'))){r.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#07100d;color:#fff;padding:24px;font:15px system-ui"><div style="max-width:560px"><b style="font-size:22px">Tea Road</b><p style="opacity:.75">Не удалось запустить интерфейс. Обновите страницу. Если ошибка повторится, откройте консоль браузера и проверьте загрузку assets.</p><code style="opacity:.55">'+String(e.message||e.error||'runtime error').replace(/</g,'&lt;')+'</code></div></div>'}});</script>'''
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
